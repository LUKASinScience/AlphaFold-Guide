<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="190" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">AlphaMissense pathogenicity score (0–1)</text>

  <defs>
    <linearGradient id="amGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2E6FD6"/>
      <stop offset="33.3%" stop-color="#B9C6DE"/>
      <stop offset="50%"  stop-color="#EDEDED"/>
      <stop offset="56.4%" stop-color="#E8B4B4"/>
      <stop offset="100%" stop-color="#D6392E"/>
    </linearGradient>
  </defs>

  <!-- bar x 60-740 = 680px representing 0-1 -->
  <g transform="translate(60,70)">
    <rect x="0" y="0" width="680" height="40" fill="url(#amGrad)" stroke="#1f2328" stroke-width="1.5"/>
    <!-- band boundary ticks at 0.333 and 0.564 -->
    <line x1="226.4" y1="0" x2="226.4" y2="40" stroke="#1f2328" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="383.5" y1="0" x2="383.5" y2="40" stroke="#1f2328" stroke-width="1.5" stroke-dasharray="4,3"/>

    <g stroke="#57606a" stroke-width="1">
      <line x1="0"     y1="40" x2="0"     y2="48"/>
      <line x1="226.4" y1="40" x2="226.4" y2="48"/>
      <line x1="383.5" y1="40" x2="383.5" y2="48"/>
      <line x1="680"   y1="40" x2="680"   y2="48"/>
    </g>
    <g font-size="14" fill="#57606a" text-anchor="middle">
      <text x="0"     y="64">0.000</text>
      <text x="226.4" y="64">0.333</text>
      <text x="383.5" y="64">0.564</text>
      <text x="680"   y="64">1.000</text>
    </g>

    <g font-size="15" font-weight="600" text-anchor="middle">
      <text x="113"  y="-10" fill="#1f2328">Likely benign</text>
      <text x="305"  y="-10" fill="#1f2328">Ambiguous</text>
      <text x="530"  y="-10" fill="#1f2328">Likely pathogenic</text>
    </g>
  </g>

  <text x="400" y="175" text-anchor="middle" font-size="13" fill="#57606a">Thresholds calibrated against ClinVar so each confident category carries ~90% precision</text>
</svg>
