<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="460" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">How far past the "twilight zone" each method still works</text>
  <text x="400" y="52" text-anchor="middle" font-size="13" fill="#57606a">illustrative, not measured data — the shape of the relationship is what matters here</text>

  <!-- plot area: x 80-740 (=660px, 0-100% identity, decreasing left to right... we go high->low identity left->right actually let's do identity decreasing left to right: 100% at x=80, 0% at x=740 -->
  <!-- axes -->
  <g stroke="#57606a" stroke-width="1.5">
    <line x1="80" y1="380" x2="740" y2="380"/>
    <line x1="80" y1="90" x2="80" y2="380"/>
  </g>

  <!-- twilight zone shading: identity 0-25%, i.e. x from 575 to 740 (since 100%->0% maps 80->740, each 1% = 6.6px, 25% => 80+6.6*75=575) -->
  <rect x="575" y="90" width="165" height="290" fill="#ffe9a8" opacity="0.45"/>
  <text x="657" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#8a6d00">twilight zone</text>

  <!-- x axis ticks: 100,75,50,25,0 -->
  <g font-size="12" fill="#57606a" text-anchor="middle">
    <text x="80"  y="400">100%</text>
    <text x="245" y="400">75%</text>
    <text x="410" y="400">50%</text>
    <text x="575" y="400">25%</text>
    <text x="740" y="400">0%</text>
  </g>
  <text x="410" y="424" text-anchor="middle" font-size="13" fill="#1f2328">pairwise sequence identity →  (decreasing)</text>

  <!-- y axis label -->
  <text x="30" y="235" text-anchor="middle" font-size="13" fill="#1f2328" transform="rotate(-90,30,235)">homology still detectable</text>

  <!-- Structure-based curve (Foldseek): stays high, gentle decline, still substantial at low identity -->
  <path d="M 80,100 C 300,105 500,130 650,190 C 700,215 730,250 740,290"
        fill="none" stroke="#2F6FCB" stroke-width="4" stroke-linecap="round"/>

  <!-- Sequence-based curve (BLAST-style): stays high then falls off a cliff around twilight zone -->
  <path d="M 80,100 C 300,110 480,140 560,220 C 610,270 650,330 740,370"
        fill="none" stroke="#E5484D" stroke-width="4" stroke-linecap="round"/>

  <!-- legend -->
  <g font-size="13">
    <line x1="470" y1="130" x2="500" y2="130" stroke="#2F6FCB" stroke-width="4"/>
    <text x="508" y="134" fill="#1f2328">Structure search (Foldseek)</text>
    <line x1="470" y1="152" x2="500" y2="152" stroke="#E5484D" stroke-width="4"/>
    <text x="508" y="156" fill="#1f2328">Sequence alignment (BLAST-style)</text>
  </g>

  <text x="400" y="448" text-anchor="middle" font-size="12" fill="#57606a">Structure is conserved far longer than sequence — that gap is exactly what Foldseek exploits</text>
</svg>
